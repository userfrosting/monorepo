name: PHPUnit

on:
  push:
    branches: [6.0, 6.1]
  pull_request:
    branches: [6.0, 6.1]
  workflow_dispatch:

jobs:
  PHPUnit-Memory:

    strategy:
      fail-fast: false
      matrix:
        php_versions: ['8.3', '8.4', '8.5']

    runs-on: ubuntu-latest
    name: PHPUnit - PHP ${{ matrix.php_versions }} - Memory SQLite

    steps:
    - uses: actions/checkout@v6
      
    - name: Setup PHP, with composer and extensions
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php_versions }}
        extensions: mbstring, dom, fileinfo, gd, memcached, redis, pdo_sqlite
        coverage: xdebug
        tools: pecl, composer

    - uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Setup Redis-server
      uses: supercharge/redis-github-action@1.8.1
      with:
        redis-version: 6
  
    - name: Setup Memcached
      uses: niden/actions-memcached@v8
    
    - name: Install Dependencies
      run: composer update --prefer-dist --no-progress

    - name: Execute tests
      run: | 
        echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"
        vendor/bin/phpunit
      
    - name: Upload coverage to Codecov
      if: github.event_name != 'schedule' && !cancelled()
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./_meta/coverage.xml
        fail_ci_if_error: false

    - name: Upload test results to Codecov
      if: github.event_name != 'schedule' && !cancelled()
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        report_type: 'test_results'
        files: ./_meta/junit.xml
        fail_ci_if_error: false

  PHPUnit-MySQL:

    strategy:
      fail-fast: false
      matrix:
        php_versions: ['8.3', '8.4', '8.5']

    runs-on: ubuntu-latest
    name: PHPUnit - PHP ${{ matrix.php_versions }} - MySQL
    needs: PHPUnit-Memory

    env:
      DB_TEST_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_USER: userfrosting
      DB_PASSWORD: password
      DB_NAME: userfrosting

    steps:
    - uses: actions/checkout@v6
    
    - name: Setup PHP, with composer and extensions
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php_versions }}
        extensions: mbstring, dom, fileinfo, gd, memcached, redis, pdo_sqlite
        coverage: xdebug
        tools: pecl, composer

    - uses: actions/setup-node@v6
      with:
        node-version: 24
    
    - name: Shutdown Ubuntu MySQL (SUDO)
      run: sudo service mysql stop # Shutdown the Default MySQL, "sudo" is necessary, please not remove it

    - name: Set up MySQL 8
      uses: mirromutth/mysql-action@v1.1
      with:
        mysql version: '8'
        mysql database: 'userfrosting'
        mysql user: 'userfrosting'
        mysql password: 'password'

    - name: Wait for MySQL
      run: |
        while ! mysqladmin ping --host=127.0.0.1 --password=password --silent; do
          sleep 1
        done
    
    - name: Setup Redis-server
      uses: supercharge/redis-github-action@1.8.1
      with:
        redis-version: 6
      
    - name: Setup Memcached
      uses: niden/actions-memcached@v8
            
    - name: Install Dependencies
      run: composer update --prefer-dist --no-progress

    - name: Execute tests
      run: | 
        echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"
        vendor/bin/phpunit
    
    - name: Upload coverage to Codecov
      if: github.event_name != 'schedule' && !cancelled()
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./_meta/coverage.xml
        fail_ci_if_error: false

    - name: Upload test results to Codecov
      if: github.event_name != 'schedule' && !cancelled()
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        report_type: 'test_results'
        files: ./_meta/junit.xml
        fail_ci_if_error: false

  PHPUnit-MariaDB:

    strategy:
      fail-fast: false
      matrix:
        php_versions: ['8.3', '8.4', '8.5']

    runs-on: ubuntu-latest
    name: PHPUnit - PHP ${{ matrix.php_versions }} - MariaDB
    needs: PHPUnit-Memory

    env:
      DB_TEST_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_USER: userfrosting
      DB_PASSWORD: password
      DB_NAME: userfrosting

    steps:
    - uses: actions/checkout@v6
    
    - name: Setup PHP, with composer and extensions
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php_versions }}
        extensions: mbstring, dom, fileinfo, gd, memcached, redis, pdo_sqlite
        coverage: xdebug
        tools: pecl, composer

    - uses: actions/setup-node@v6
      with:
        node-version: 24
    
    - name: Shutdown Ubuntu MySQL (SUDO)
      run: sudo service mysql stop # Shutdown the Default MySQL, "sudo" is necessary, please not remove it

    - name: Set up MariaDB
      uses: getong/mariadb-action@v1.11
      with:
        mysql database: 'userfrosting'
        mysql user: 'userfrosting'
        mysql password: 'password'
    
    - name: Setup Redis-server
      uses: supercharge/redis-github-action@1.8.1
      with:
        redis-version: 6
      
    - name: Setup Memcached
      uses: niden/actions-memcached@v8

    - name: Install Dependencies
      run: composer update --prefer-dist --no-progress

    - name: Execute tests
      run: | 
        echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"
        vendor/bin/phpunit
    
    - name: Upload coverage to Codecov
      if: github.event_name != 'schedule' && !cancelled()
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./_meta/coverage.xml
        fail_ci_if_error: false

    - name: Upload test results to Codecov
      if: github.event_name != 'schedule' && !cancelled()
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        report_type: 'test_results'
        files: ./_meta/junit.xml
        fail_ci_if_error: false

  PHPUnit-SQLite:

    strategy:
      fail-fast: false
      matrix:
        php_versions: ['8.3', '8.4', '8.5']

    runs-on: ubuntu-latest
    name: PHPUnit - PHP ${{ matrix.php_versions }} - SQLite
    needs: PHPUnit-Memory

    env:
      DB_TEST_CONNECTION: sqlite
      DB_NAME: database.sqlite

    steps:
    - uses: actions/checkout@v6
    
    - name: Setup PHP, with composer and extensions
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php_versions }}
        extensions: mbstring, dom, fileinfo, gd, memcached, redis, pdo_sqlite
        coverage: xdebug
        tools: pecl, composer

    - uses: actions/setup-node@v6
      with:
        node-version: 24
    
    - name: Setup Redis-server
      uses: supercharge/redis-github-action@1.8.1
      with:
        redis-version: 6
    
    - name: Setup Memcached
      uses: niden/actions-memcached@v8
          
    - name: Install Dependencies
      run: composer update --prefer-dist --no-progress
    
    - name: Create SQLite Database
      run: touch database.sqlite

    - name: Execute tests
      run: | 
        echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"
        vendor/bin/phpunit
    
    - name: Upload coverage to Codecov
      if: github.event_name != 'schedule' && !cancelled()
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./_meta/coverage.xml
        fail_ci_if_error: false

    - name: Upload test results to Codecov
      if: github.event_name != 'schedule' && !cancelled()
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        report_type: 'test_results'
        files: ./_meta/junit.xml
        fail_ci_if_error: false
  
  PHPUnit-Postgre:

    strategy:
      fail-fast: false
      matrix:
        php_versions: ['8.3', '8.4', '8.5']

    runs-on: ubuntu-latest
    name: PHPUnit - PHP ${{ matrix.php_versions }} - PostgreSQL
    needs: PHPUnit-Memory

    env:
      DB_TEST_CONNECTION: pgsql
      DB_USER: userfrosting
      DB_PASSWORD: password
      DB_NAME: userfrosting

    steps:
    - uses: actions/checkout@v6
    
    - name: Setup PHP, with composer and extensions
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php_versions }}
        extensions: mbstring, dom, fileinfo, gd, memcached, redis, pdo_sqlite, pdo_pgsql
        coverage: xdebug
        tools: pecl, composer
    
    - name: Setup PostgreSQL
      uses: harmon758/postgresql-action@v1
      with:
        postgresql db: 'userfrosting'
        postgresql user: 'userfrosting'
        postgresql password: 'password'

    - uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Setup Redis-server
      uses: supercharge/redis-github-action@1.8.1
      with:
        redis-version: 6
    
    - name: Setup Memcached
      uses: niden/actions-memcached@v8

    - name: Install Dependencies
      run: composer update --prefer-dist --no-progress

    - name: Execute tests
      run: | 
        echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"
        vendor/bin/phpunit
    
    - name: Upload coverage to Codecov
      if: github.event_name != 'schedule' && !cancelled()
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./_meta/coverage.xml
        fail_ci_if_error: false

    - name: Upload test results to Codecov
      if: github.event_name != 'schedule' && !cancelled()
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        report_type: 'test_results'
        files: ./_meta/junit.xml
        fail_ci_if_error: false

