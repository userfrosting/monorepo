services:
  mailpit:
    image: 'axllent/mailpit:latest'
    ports:
      - '127.0.0.1:${DOCKER_SMTP_PORT:-1025}:1025'
      - '[::1]:${DOCKER_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${DOCKER_MAILPIT_PORT:-8025}:8025'
      - '[::1]:${DOCKER_MAILPIT_PORT:-8025}:8025'
    networks:
      - backend
