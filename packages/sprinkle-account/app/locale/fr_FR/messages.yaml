ACCOUNT:
  '@TRANSLATION': Compte d'utilisateur
  EXCEPTION:
    TITLE: Exception de compte
    DESCRIPTION: Une erreur non spécifiée avec le compte a été rencontrée.
    ACCESS_DENIED:
      TITLE: Accès refusé
      DESCRIPTION: Hmm, on dirait que vous n'avez pas la permission de faire ceci.
    DISABLED:
      TITLE: Compte désactivé
      DESCRIPTION: Ce compte a été désactivé. Veuillez nous contacter pour plus d'informations.
    DEFAULT_GROUP:
      TITLE: Groupe par défaut introuvable
      DESCRIPTION: L'enregistrement du compte ne fonctionne pas car le groupe par
        défaut {{slug}} n'existe pas.
    INVALID:
      TITLE: Compte invalide
      DESCRIPTION: Ce compte n'existe pas. Il a peut-être été supprimé. Veuillez nous
        contacter pour plus d'informations.
    NOT_FOUND:
      TITLE: Compte introuvable
      DESCRIPTION: Ce compte n'existe pas. Il a peut-être été supprimé.
    COMPROMISED:
      TITLE: Compte compromis
      DESCRIPTION: Quelqu'un a peut-être utilisé vos informations de connexion pour
        accéder à cette page. Pour votre sécurité, toutes les sessions ont été déconnectées.
        Veuillez vous reconnecter et vérifier votre compte pour toute activité suspecte.
        Vous pouvez également souhaiter changer votre mot de passe.
    UNVERIFIED:
      TITLE: Compte non vérifié
      DESCRIPTION: Votre compte n'a pas encore été vérifié. Utilisez le formulaire
        <i>{{&ACCOUNT.VERIFICATION}}</i> pour activer votre compte.
    EXPIRED:
      TITLE: Session expirée
      DESCRIPTION: Votre session a expiré. Veuillez vous connecter à nouveau.
    INVALID_CREDENTIALS:
      TITLE: Identifiants invalides
      DESCRIPTION: Utilisateur non trouvé ou mot de passe invalide.
    LOGGEDIN:
      TITLE: Déjà connecté
      DESCRIPTION: Vous ne pouvez pas accéder à cette ressource car vous êtes déjà
        connecté
    LOGIN_REQUIRED:
      TITLE: Connexion requise
      DESCRIPTION: Veuillez vous connecter pour continuer
    PASSWORD_EXPIRED:
      TITLE: Mot de passe expiré
      DESCRIPTION: Votre mot de passe a expiré. Veuillez réinitialiser votre mot de
        passe.
    PASSWORD_RESET:
      TITLE: Jeton de réinitialisation de mot de passe invalide
      DESCRIPTION: Cette demande de réinitialisation de mot de passe est introuvable
        ou a expiré.
    VERIFICATION_DISABLED:
      TITLE: Vérification désactivée
      DESCRIPTION: La vérification du compte est désactivée. Veuillez nous contacter
        pour plus d'informations.
    VERIFICATION_FAILED:
      TITLE: Exception de vérification
      DESCRIPTION: Ce code de vérification n'est pas valide, ou le compte est déjà
        vérifié.
  ERROR:
    '@TRANSLATION': Erreur de validation du compte
    MISSING_PARAM: Le compte ne peut pas être enregistré car '{{param}}' est requis.
  HAVE_ONE: Vous avez déjà un compte ?
  MASTER_NOT_EXISTS: Vous ne pouvez pas enregistrer un compte tant que le compte principal
    n'a pas été créé!
  MY: Mon compte
  SETTINGS:
    '@TRANSLATION': Paramètres du compte
    DESCRIPTION: Mettez à jour les paramètres de votre compte, y compris votre adresse
      e-mail, votre nom et votre mot de passe.
    EMAIL: Mise à jour du email
    PASSWORD: Modifier le mot de passe
    PERSONAL: Information personnelle
    UPDATED: Paramètres du compte mis à jour
  VERIFICATION:
    '@TRANSLATION': Vérification du compte
    CODE:
      '@TRANSLATION': Code de vérification
      ENTER: Entrez le code de vérification
      EXPLAIN: Entrez le code de vérification que vous avez reçu par email.
      IDENTIFY: Vérifier votre identité
      SEND: Envoyer le code par email
      SENT: Si un compte non activé a été trouvé, un email avec un code de vérification
        a été envoyé à <strong>{{email}}</strong>. Veuillez vérifier votre boîte de
        réception et vos dossiers de spam pour cet email.
      VERIFY: Vérifier le code
    COMPLETE: Votre compte a été validé. Vous pouvez maintenant vous connecter.
    EXPLAIN: Veuillez saisir l'adresse email que vous avez utilisée pour vous inscrire
      et un code de vérification vous sera renvoyé.
EMAIL:
  INVALID: Il n'y a aucun compte pour <strong>{{email}}</strong>.
  IN_USE: Le email <strong>{{email}}</strong> est déjà utilisé.
  VERIFICATION_REQUIRED: Email (vérification requise - utiliser une adresse réelle!)
FIRST_NAME: Prénom
GUEST: Invité
HEADER_MESSAGE_ROOT: VOUS ÊTES CONNECTÉ EN TANT QUE L'UTILISATEUR ROOT
LAST_NAME: Nom de famille
LOCALE:
  ACCOUNT: La langue utilisé pour votre compte d'utilisateur
  INVALID: <strong>{{locale}}</strong> n'est pas une langue valide.
LOGIN:
  '@TRANSLATION': Connexion
  PAGE: Connectez-vous à votre compte
LOGOUT: Déconnexion
LOGGED_OUT: Vous avez été déconnecté avec succès.
NAME_AND_EMAIL: Nom et email
PASSWORD:
  '@TRANSLATION': Mot de passe
  BETWEEN: Entre {{min}} et {{max}} charactères
  CONFIRM: Confirmer le mot de passe
  CONFIRM_CURRENT: Veuillez confirmer votre mot de passe actuel
  CONFIRM_NEW: Confirmer le nouveau mot de passe
  CONFIRM_NEW_EXPLAIN: Confirmer le mot de passe
  CURRENT: Mot de passe actuel
  CURRENT_EXPLAIN: Vous devez confirmer votre mot de passe actuel pour apporter des
    modifications
  INVALID: Le mot de passe actuel ne correspond pas à celui que nous avons au dossier
  NEW:
    '@TRANSLATION': Nouveau mot de passe
    EXPLAIN: Choisissez un nouveau mot de passe
    SET: Définir un nouveau mot de passe
  RESET:
    '@TRANSLATION': Réinitialiser le mot de passe
    EMAIL: Veuillez saisir l'adresse e-mail que vous avez utilisée pour vous inscrire.
      Un lien avec les instructions pour réinitialiser votre mot de passe vous sera
      envoyé par email.
    INVALID: Cette demande de réinitialisation de mot de passe n'a pas pu être trouvée
      ou a expiré. Veuillez réessayer de soumettre votre demande.
    PAGE: Utilisez ce formulaire pour réinitialiser votre mot de passe si vous n'avez
      pas accès à votre compte.
    YOURS: Mot de passe oublié ?
    REQUEST_SENT: Si l'adresse e-mail <strong>{{email}}</strong> correspond à un compte
      dans notre système, un code de vérification sera envoyé à <strong>{{email}}</strong>.
    SUCCESS: Votre nouveau mot de passe est défini. Vous pouvez maintenant vous connecter
      avec votre nouveau mot de passe.
  UPDATED: Mot de passe du compte mis à jour
PROFILE:
  UPDATED: Paramètres du profil mis à jour
RATE_LIMIT_EXCEEDED: La limite de tentatives pour cette action a été dépassée. Vous
  devez attendre {{delay}} secondes avant de pouvoir effectuer une autre tentative.
REGISTER:
  '@TRANSLATION': S'inscrire
  PAGE: Créer un nouveau compte
REGISTER_ME: Créer mon compte
REGISTRATION:
  COMPLETE: Vous êtes inscrit avec succès. Vous pouvez maintenant vous connecter.
  COMPLETE_VERIFICATION: Vous êtes inscrit avec succès. Vous recevrez bientôt un e-mail
    de validation contenant un lien pour activer votre compte. Vous ne pourrez pas
    vous connecter avant d'avoir terminé cette étape.
  DISABLED: Désolé, l'enregistrement de compte a été désactivé.
  ERROR: Erreur d'inscription
  QUESTION: Pas encore de compte?
  MAIL_ERROR: Une erreur est survenue lors de l'envoi de l'email de vérification.
    Veuillez contacter votre administrateur.
  UNKNOWN: Un problème a été rencontré lors du processus d'enregistrement du compte.
REMEMBER_ME: Se souvenir de moi!
TOS_AGREEMENT: En créant un compte avec {{site_title}}, vous acceptez les termes et
  conditions.
USERNAME:
  '@TRANSLATION': Nom d'utilisateur
  CHOOSE: Choisissez un nom d'utilisateur unique
  INVALID: Nom d'utilisateur invalide
  IN_USE: Le nom d'utilisateur '{{username}}' est déjà utilisé.
  NOT_AVAILABLE: Le nom d'utilisateur <strong>{{user_name}}</strong> n'est pas disponible.
    Choisissez un autre nom, ou cliquez sur « suggérer ».
  UNMODIFIABLE: Le nom d'utilisateur ne devrait pas être modifié. Cliquez pour déverrouiller
    et utilisez avec précaution.
WELCOME: Bienvenue {{full_name}}!
