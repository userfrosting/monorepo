# Monorepo Docker services are for local development only.
include:
  - path: ./docker/compose.${DOCKER_DB_CONNECTION:-mysql}.yaml
services:
  app:
    restart: unless-stopped
    tty: true
    extends:
      file: ./docker/compose.database-dependencies.yaml
      service: ${DOCKER_DB_CONNECTION:-mysql}
    build:
      context: ./docker/app
    environment:
      DB_CONNECTION: ${DOCKER_DB_CONNECTION:-mysql}
      DB_HOST: ${DOCKER_DB_CONNECTION:-mysql}
      DB_NAME: ${DOCKER_DB_NAME:-userfrosting}
      DB_USER: ${DOCKER_DB_USER:-docker}
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:-secret}
      DB_TEST_CONNECTION: ${DOCKER_DB_TEST_CONNECTION:-memory}
      DB_TEST_HOST: ${DOCKER_DB_CONNECTION:-mysql}
      DB_TEST_NAME: ${DOCKER_DB_TEST_NAME:-${DOCKER_DB_NAME:-userfrosting_test}}
      DB_TEST_USER: ${DOCKER_DB_TEST_USER:-${DOCKER_DB_USER:-userfrosting_test}}
      DB_TEST_PASSWORD: ${DOCKER_DB_TEST_PASSWORD:-${DOCKER_DB_PASSWORD:-testsecret}}
    volumes:
      - .:/app
      - node-modules:/app/node_modules
      - ./docker/app/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - backend
  nginx:
    restart: unless-stopped
    tty: true
    ports:
      - "127.0.0.1:${DOCKER_HTTP_PORT:-8080}:80"
      - "[::1]:${DOCKER_HTTP_PORT:-8080}:80"
    build:
      context: ./docker/nginx
    volumes:
      - .:/app
    depends_on:
      - app
      - mailpit
      - vue-frontend
    networks:
      - frontend
      - backend
  vue-frontend:
    restart: unless-stopped
    tty: true
    build:
      context: .
      dockerfile: ./docker/vue/Dockerfile
    ports:
      - "127.0.0.1:${DOCKER_VITE_PORT:-5173}:5173"
      - "[::1]:${DOCKER_VITE_PORT:-5173}:5173"
    volumes:
      - .:/app
      - node-modules:/app/node_modules
    networks:
      - frontend
  mailpit:
    image: 'axllent/mailpit:latest'
    ports:
      - '127.0.0.1:${DOCKER_SMTP_PORT:-1025}:1025'
      - '[::1]:${DOCKER_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${DOCKER_MAILPIT_PORT:-8025}:8025'
      - '[::1]:${DOCKER_MAILPIT_PORT:-8025}:8025'
    networks:
      - backend
volumes:
  node-modules:
    driver: local
networks:
  frontend:
  backend:
    driver: bridge
