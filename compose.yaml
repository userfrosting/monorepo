# Monorepo Docker services are for local development only.
include:
  - ./docker/compose.mysql.yaml
  - ./docker/compose.mariadb.yaml
  - ./docker/compose.pgsql.yaml
  - ./docker/compose.mailpit.yaml
  - ./docker/compose.mysql-test.yaml
  - ./docker/compose.mariadb-test.yaml
  - ./docker/compose.pgsql-test.yaml
  - ./docker/compose.memcached.yaml
  - ./docker/compose.redis.yaml
services:
  app:
    restart: unless-stopped
    tty: true
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      mariadb:
        condition: service_healthy
        required: false
      pgsql:
        condition: service_healthy
        required: false
      mysql-test:
        condition: service_healthy
        required: false
      mariadb-test:
        condition: service_healthy
        required: false
      pgsql-test:
        condition: service_healthy
        required: false
    build:
      context: ./docker/app
    environment:
      DB_CONNECTION: ${DOCKER_DB_CONNECTION:-mysql}
      DB_HOST: ${DOCKER_DB_CONNECTION:-mysql}
      DB_NAME: ${DOCKER_DB_NAME:-userfrosting}
      DB_USER: ${DOCKER_DB_USER:-docker}
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:-secret}
      DB_TEST_CONNECTION: ${DOCKER_DB_TEST_CONNECTION:-memory}
      DB_TEST_HOST: ${DOCKER_DB_TEST_HOST:-${DOCKER_DB_TEST_CONNECTION:-memory}-test}
      DB_TEST_NAME: ${DOCKER_DB_TEST_NAME:-userfrosting_test}
      DB_TEST_USER: ${DOCKER_DB_TEST_USER:-userfrosting_test}
      DB_TEST_PASSWORD: ${DOCKER_DB_TEST_PASSWORD:-testsecret}
      CACHE_DRIVER: ${DOCKER_CACHE_DRIVER:-file}
      MEMCACHED_HOST: memcached
      REDIS_HOST: redis
    volumes:
      - .:/app
      - node-modules:/app/node_modules
      - ./docker/app/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - backend
  nginx:
    restart: unless-stopped
    tty: true
    ports:
      - "127.0.0.1:${DOCKER_HTTP_PORT:-8080}:80"
      - "[::1]:${DOCKER_HTTP_PORT:-8080}:80"
    build:
      context: ./docker/nginx
    volumes:
      - .:/app
    depends_on:
      - app
      - mailpit
      - vue-frontend
    networks:
      - frontend
      - backend
  vue-frontend:
    restart: unless-stopped
    tty: true
    build:
      context: .
      dockerfile: ./docker/vue/Dockerfile
    ports:
      - "127.0.0.1:${DOCKER_VITE_PORT:-5173}:5173"
      - "[::1]:${DOCKER_VITE_PORT:-5173}:5173"
    volumes:
      - .:/app
      - node-modules:/app/node_modules
    networks:
      - frontend
volumes:
  node-modules:
    driver: local
networks:
  frontend:
  backend:
    driver: bridge
